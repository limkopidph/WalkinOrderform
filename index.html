<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walk-in Order Form</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--text:#1f2a24;--muted:#6b756f;--line:#d9d4cb;--accent:#128c4a;--accent-t:#fff;--chip:#eef3ef;--bubble:#d9fdd3;--bubble-t:#111b21;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111613;--card:#1b231e;--text:#e8efe9;--muted:#98a59d;--line:#2e3a33;--accent:#25b865;--accent-t:#06210f;--chip:#243029;--bubble:#005c4b;--bubble-t:#e9edef}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111613;--card:#1b231e;--text:#e8efe9;--muted:#98a59d;--line:#2e3a33;--accent:#25b865;--accent-t:#06210f;--chip:#243029;--bubble:#005c4b;--bubble-t:#e9edef}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label.t{display:block;font-weight:700;margin:4px 0 6px;font-size:17px}
.sub{color:var(--muted);font-size:13px;margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:8px 12px;border:1px solid var(--line);background:var(--chip);border-radius:999px;cursor:pointer;user-select:none}
.chips input:checked+span{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sec{margin-bottom:12px}
input[type=text],input[type=tel]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;margin-bottom:12px}
.bubble{background:var(--bubble);color:var(--bubble-t);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45;min-height:34px}
.bubble b{font-weight:700}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button,a.btn{flex:1;min-width:120px;text-align:center;text-decoration:none;padding:12px;border-radius:10px;border:1px solid var(--accent);font:inherit;font-weight:600;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-t)}
.ghost{background:transparent;color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Walk-in Order</h1>

<div class="card">
  <div class="sec"><label class="t">Drink</label><div id="drink"></div></div>
  <div class="sec"><label class="t">Toast</label><div id="toast"></div></div>

  <label class="t" for="name">Name</label>
  <input id="name" type="text" placeholder="e.g. Falisha" autocomplete="off">

  <div class="sec"><label class="t">Type</label><div id="type"></div></div>

  <label class="t" for="notes">Notes</label>
  <input id="notes" type="text" autocomplete="off">

  <label class="t" for="phone">WhatsApp number (optional)</label>
  <input id="phone" type="tel" placeholder="e.g. 6591234567 (country code, no +)">
</div>

<div class="card">
  <label class="t">Message preview</label>
  <div class="bubble" id="preview"></div>
  <div class="btns">
    <a class="btn primary" id="send" href="#" target="_blank" rel="noopener">Send to WhatsApp</a>
    <button class="ghost" id="copy" type="button">Copy message</button>
  </div>
  <div class="btns"><button class="ghost" id="next" type="button">New order (clear form)</button></div>
  <p class="hint" id="status">Leave the number blank to choose the chat inside WhatsApp.</p>
  <textarea id="manual" readonly style="display:none;width:100%;margin-top:8px;min-height:110px;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)"></textarea>
</div>
</div>

<script>
var NODRINK="NO DRINK ! \uD83D\uDEAB\uD83E\uDD64", NOBREAD="NO BREAD ! \uD83D\uDEAB\uD83D\uDCE6";
var G={
 drink:[
  ["Coffee/Kopi",["Kopi","Kopi O","Kopi C","Kopi Susu","( + )"]],
  ["Tea/Teh",["Teh","Teh O","Teh C","Teh Susu","( + )"]],
  ["Others",["Milo","Milo C","Ovaltine","Yuan Yang","Horlicks","Chinese Tea","( + )"]],
  ["Drink Additive",["/ Gao","/ Poh","/Kai Dai","/Siew Dai","/No Sugar","/Less Milk","/More Milk","/No milk","/Kosong"]],
  ["Additional drinks requirement",["2 cups","3 cups","4 cups","half cup","Paper cup","Using own cup",NODRINK]]
 ],
 toast:[
  ["Toast",["Kaya","Butter","Jam","Peanut","Peanut + Butter","Sugar"]],
  ["Toast Additive",["Don\u2019t toast","Steam","/half set(1 pc)","/2 sets(4pcs)","/3 sets(6pcs)","Thick spreading","Thin spreading","Paper bag",NOBREAD]]
 ],
 type:[
  ["",["Cleaner","DC","Rehab","SWPSS","IT","Doctor","Volunteer","Security","Reception","Staff","Take Away","Delivery","Caregiver","Homecare","Complimentary Drink/Extra Cup","Cut Queue","Dine-in","L3","L4","L5","L6"]]
 ]
};
var $=function(i){return document.getElementById(i)};
function mk(id){
  var box=$(id);
  G[id].forEach(function(g){
    if(g[0]){var h=document.createElement("div");h.className="sub";h.textContent=g[0];box.appendChild(h)}
    var row=document.createElement("div");row.className="chips";
    g[1].forEach(function(v){
      var l=document.createElement("label");
      var i=document.createElement("input");i.type="checkbox";i.value=v;i.addEventListener("change",update);
      var s=document.createElement("span");s.textContent=v;
      l.appendChild(i);l.appendChild(s);row.appendChild(l);
    });
    box.appendChild(row);
  });
}
function picked(id){return Array.prototype.map.call($(id).querySelectorAll("input:checked"),function(i){return i.value}).join(" ")}
function build(){
  var L=[];
  [["Drink",picked("drink")],["Toast",picked("toast")],["Name",$("name").value.trim()],["Type",picked("type")],["Notes",$("notes").value.trim()]].forEach(function(f){if(f[1])L.push("*"+f[0]+"* : "+f[1])});
  return L.join("\n");
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function update(){
  var m=build();
  $("preview").innerHTML=esc(m).replace(/\*([^*\n]+)\*/g,"<b>$1</b>");
  var p=$("phone").value.replace(/\D/g,"");
  $("send").href="https://wa.me/"+p+"?text="+encodeURIComponent(m);
  try{localStorage.setItem("walkin_phone",$("phone").value)}catch(e){}
}
function legacyCopy(m){
  var t=document.createElement("textarea");t.value=m;
  t.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(t);
  t.contentEditable=true;t.focus();t.select();t.setSelectionRange(0,t.value.length);
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(t);return ok;
}
function showManual(m){
  var b=$("manual");b.style.display="block";b.value=m;b.focus();b.select();b.setSelectionRange(0,m.length);
  $("status").textContent="Auto-copy was blocked. The message is selected below: tap Copy in the pop-up, or press and hold and choose Copy.";
}
$("copy").addEventListener("click",function(){
  var m=build();
  if(legacyCopy(m)){$("status").textContent="Copied. Paste it into WhatsApp.";return}
  try{navigator.clipboard.writeText(m).then(function(){$("status").textContent="Copied. Paste it into WhatsApp."},function(){showManual(m)})}catch(e){showManual(m)}
});
$("next").addEventListener("click",function(){
  document.querySelectorAll(".chips input").forEach(function(i){i.checked=false});
  $("name").value="";$("notes").value="";$("manual").style.display="none";update();$("status").textContent="Ready for the next order.";
});
mk("drink");mk("toast");mk("type");
try{var p=localStorage.getItem("walkin_phone");if(p)$("phone").value=p}catch(e){}
["name","notes","phone"].forEach(function(i){$(i).addEventListener("input",update)});
update();
</script>
</body>
</html>
